[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisismap-ai"
version = "1.0.0"
description = "Advanced crisis monitoring and detection platform using AI and vector search"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "CrisisMap AI Team", email = "team@crisismap.ai"}
]
maintainers = [
    {name = "CrisisMap AI Team", email = "team@crisismap.ai"}
]
keywords = ["ai", "crisis", "monitoring", "disaster", "vector-search", "mongodb", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pymongo>=4.6.0",
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "sentence-transformers>=2.2.2",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
    "typing-extensions>=4.8.0",
    "dnspython>=2.4.0",
    "colorama>=0.4.6",
    "aiofiles>=23.2.1",
    "httpx>=0.25.0",
    "orjson>=3.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "bandit>=1.7.5",
    "safety>=2.3.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.3.0",
    "coverage[toml]>=7.3.0",
]
monitoring = [
    "prometheus-client>=0.18.0",
    "structlog>=23.2.0",
    "sentry-sdk[fastapi]>=1.38.0",
]
deployment = [
    "gunicorn>=21.2.0",
    "docker>=6.1.0",
]

[project.urls]
Homepage = "https://github.com/Mukprojects/CrisisMap_AI"
Documentation = "https://github.com/Mukprojects/CrisisMap_AI/blob/main/README.md"
Repository = "https://github.com/Mukprojects/CrisisMap_AI.git"
"Bug Tracker" = "https://github.com/Mukprojects/CrisisMap_AI/issues"

[project.scripts]
crisismap = "crisismap_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crisismap_ai*"]
exclude = ["tests*", "Dataset*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | Dataset
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["Dataset/*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "Dataset/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "sentence_transformers.*",
    "torch.*",
    "pymongo.*",
    "tqdm.*",
    "beautifulsoup4.*",
    "colorama.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=crisismap_ai",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["crisismap_ai"]
omit = [
    "*/tests/*",
    "*/Dataset/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "Dataset"]
skips = ["B101", "B601"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "Dataset",
    ".venv",
    ".tox",
    ".eggs",
    "*.egg",
]
per-file-ignores = [
    "__init__.py:F401",
]